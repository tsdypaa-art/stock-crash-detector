name: Deploy Multiple Lambda Functions
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-1
    # 🚚 【関数1】株価監視用 Lambda のデプロイ（超軽量化）
    - name: Deploy Lambda Function 1 (Monitor)
      run: |
        zip -j monitor_deploy.zip lambda_function.py common.py
        aws lambda update-function-code \
          --function-name stock-crash-monitor \
          --zip-file fileb://monitor_deploy.zip
    # 🚚 【関数2】銘柄登録用 Lambda のデプロイ
    - name: Deploy Lambda Function 2 (Register)
      run: |
        mkdir register_dir
        cp lambda_function_register.py register_dir/lambda_function.py
        cp common.py register_dir/common.py
        cd register_dir
        zip -r ../register_deploy.zip .
        cd ..
        aws lambda update-function-code \
          --function-name stock-register-handler \
          --zip-file fileb://register_deploy.zip
